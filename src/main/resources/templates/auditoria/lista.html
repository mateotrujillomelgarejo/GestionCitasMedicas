<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Auditoría del Sistema</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/all.min.css}">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .table-hover tbody tr:hover {
      background-color: #eef3f8;
      transition: 0.2s;
    }
    .badge-login { background-color: #198754; }     /* Verde */
    .badge-logout { background-color: #6c757d; }   /* Gris */
    .badge-insert { background-color: #0d6efd; }   /* Azul */
    .badge-update { background-color: #ffc107; }   /* Amarillo */
    .badge-delete { background-color: #dc3545; }   /* Rojo */
  </style>
</head>
<body class="p-4">

<div class="container">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary">
      <i class="fa-solid fa-shield-halved me-2"></i> Registro de Auditoría del Sistema
    </h3>
    <a href="/dashboard" class="btn btn-secondary">
      <i class="fa-solid fa-arrow-left"></i> Volver
    </a>
  </div>

  <!-- Tabla -->
  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Acción</th>
            <th>Tabla</th>
            <th>Descripción</th>
            <th>Fecha y Hora</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${registros}" class="text-center">
            <td th:text="${a.id}"></td>
            <td>
              <i class="fa-solid fa-user text-primary me-1"></i>
              <span th:text="${a.usuario.username}"></span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${a.accion == 'LOGIN'} ? 'badge-login' :
                                    (a.accion == 'LOGOUT' ? 'badge-logout' :
                                    (a.accion == 'INSERT' ? 'badge-insert' :
                                    (a.accion == 'UPDATE' ? 'badge-update' :
                                    (a.accion == 'DELETE' ? 'badge-delete' : 'bg-secondary'))))"
                    th:text="${a.accion}">
              </span>
            </td>
            <td th:text="${a.tabla}"></td>
            <td class="text-start" th:text="${a.descripcion}"></td>
            <td th:text="${#temporals.format(a.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
          </tr>
        </tbody>
      </table>

      <!-- Mensaje si no hay registros -->
      <div th:if="${#lists.isEmpty(registros)}" class="alert alert-info text-center mt-3">
        <i class="fa-solid fa-circle-info me-2"></i>No se han registrado acciones aún.
      </div>
    </div>
  </div>
</div>

</body>
</html>
