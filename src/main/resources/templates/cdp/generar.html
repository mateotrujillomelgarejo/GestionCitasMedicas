<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Comprobante de Pago</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 40px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 900px;
            margin: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .top-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        label {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            flex: 1;
        }

        legend {
            font-weight: 600;
            font-size: 14px;
            padding: 0 8px;
        }

        .form-sections {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-sections .form-group {
            margin-bottom: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 9px 20px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background-color: #0069d9;
        }

        .buscar-btn {
            width: 100%;
            margin-top: 10px;
        }

        .bottom-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .bottom-section select, 
        .bottom-section input {
            width: 100%;
        }

        .generate-btn {
            width: 100%;
            background-color: #007bff;
            color: #fff;
            font-weight: 600;
            padding: 12px;
            font-size: 15px;
        }

        .generate-btn:hover {
            background-color: #0069d9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generar Comprobante de Pago</h2>

        <!-- Sección superior -->
        <div class="top-section">
            <div class="form-group">
                <label for="cdp">Número de CDP</label>
                <input type="text" id="cdp">
            </div>
            <div class="form-group">
                <label for="fechaRegistro">Fecha de Registro</label>
                <input type="text" id="fechaRegistro" placeholder="dd/mm/aaaa">
            </div>
        </div>

        <!-- Sección de datos de cita y datos adicionales -->
        <div class="form-sections">
            <fieldset>
                <legend>Datos de la Cita Médica</legend>

                <div class="form-group">
                    <label for="idCita">ID de la Cita</label>
                    <input type="text" id="idCita">
                </div>

                <div class="form-group">
                    <label for="paciente">Nombre del Paciente</label>
                    <input type="text" id="paciente">
                </div>

                <div class="form-group">
                    <label for="medico">Nombre del médico</label>
                    <input type="text" id="medico">
                </div>

                <div class="form-group">
                    <label for="fechaCita">Fecha de la Cita</label>
                    <input type="text" id="fechaCita" placeholder="dd/mm/aaaa">
                </div>

                <button class="buscar-btn">Buscar cita</button>
            </fieldset>

            <fieldset>
                <legend>Datos Adicionales (Boleto o Factura)</legend>

                <div class="form-group">
                    <label for="tipoComprobante">Tipo de comprobante</label>
                    <select id="tipoComprobante">
                        <option>Seleccione una opción</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dniRuc">Dni / RUC</label>
                    <input type="text" id="dniRuc" placeholder="Ingrese dni o ruc">
                </div>

                <div class="form-group">
                    <label for="razonSocial">Persona natural/ Razon social</label>
                    <select id="razonSocial">
                        <option>Seleccione una opción</option>
                    </select>
                </div>
            </fieldset>
        </div>

        <!-- Sección final -->
        <div class="bottom-section">
            <div class="form-group">
                <label for="medioPago">Medio de Pago</label>
                <select id="medioPago">
                    <option>Seleccione una opción</option>
                </select>
            </div>

            <div class="form-group">
                <label for="montoTotal">Monto Total</label>
                <input type="text" id="montoTotal">
            </div>
        </div>

        <button class="generate-btn">Generar Comprobante</button>
    </div>

</body>
</html>
