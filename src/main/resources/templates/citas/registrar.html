<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registrar Cita</title>

  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  
  <link rel="stylesheet" th:href="@{/css/registrarCita.css}">

  <link rel="stylesheet" th:href="@{/css/icons/bootstrap-icons.css}">
</head>
<body>

  <div class="container">
    <h2>Registrar Cita</h2>

    <!-- Mensaje de éxito -->
<div id="mensajeExito" 
     th:if="${mensaje}" 
     class="alert alert-success alert-dismissible fade show text-center" 
     role="alert" 
     style="display:none;"
     th:text="${mensaje}">
</div>


    <form th:action="@{/citas/registrar}" th:object="${cita}" method="post">
      <!-- Encabezado -->
      <div class="form-section">
        <div class="row">
          <div class="col-md-6">
            <label class="form-label">Nro. Cita</label>
            <input type="text" class="form-control" th:field="*{codigoCita}" readonly />
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de registro</label>
            <input type="text" class="form-control" th:value="${fechaActual}" readonly />
            <input type="hidden" th:field="*{fechaRegistro}" th:value="${fechaActual}" />
          </div>
        </div>
      </div>

      <!-- Detalle del paciente -->
      <div class="form-section">
        <h5>Detalle Paciente</h5>
        <div class="row">
          <div class="col-md-4">
            <label class="form-label">Nombre y apellidos</label>
            <input type="text" class="form-control" id="inputNombrePaciente" readonly />
          </div>
          <div class="col-md-4">
            <label class="form-label">DNI del paciente</label>
            <input type="text" class="form-control" id="inputDniPaciente" readonly />
          </div>
          <div class="col-md-4">
            <label class="form-label">Historia Clínica</label>
            <input type="text" class="form-control" id="inputHistoriaClinica" readonly />
          </div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <button type="button" class="btn btn-lightgray" id="btnOpenModalPaciente">
            <i class="bi bi-search"></i> Buscar Paciente
          </button>
          <a th:href="@{/pacientes/mantener}" class="btn btn-lightgray">
            <i class="bi bi-pin-angle"></i> Mantener Paciente
          </a>
        </div>
      </div>

      <!-- Detalle de la cita -->
      <div class="form-section">
        <h5>Detalle de la cita</h5>
        <div class="row align-items-end">
          <div class="col-md-4">
            <label class="form-label">Médico</label>
            <input type="text" id="inputNombreMedico" class="form-control" th:value="${cita.medico?.nombre}" readonly />
          </div>
          <div class="col-md-4">
            <label class="form-label">Consultorio</label>
            <input type="text" id="inputConsultorioMedico" class="form-control"
           th:value="${cita.medico != null ? cita.medico.consultorio : ''}" readonly />
          </div>
          <div class="col-md-4">
            <button type="button" class="btn btn-lightgray w-100"  id="btnOpenModalMedico">
              <i class="bi bi-search"></i> Buscar Disp. Médico
            </button>
          </div>
        </div>

        <div class="row mt-3">
          <div class="col-md-4">
            <label class="form-label">Fecha de la cita</label>
            <input type="date" class="form-control" th:field="*{fechaCita}" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Hora de la cita</label>
            <input type="time" class="form-control" th:field="*{horaCita}" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Tipo de atención</label>
            <input type="text" class="form-control" th:field="*{tipoAtencion}" />
          </div>
        </div>
      </div>

      <!-- Campos ocultos necesarios para enviar el paciente -->
      <input type="hidden" th:field="*{paciente.idPaciente}" />
      <input type="hidden" th:field="*{paciente.nombreCompleto}" />
      <input type="hidden" th:field="*{paciente.dni}" />
      <input type="hidden" th:field="*{paciente.historiaClinica}" />

      <input type="hidden" th:field="*{medico.idMedico}" />
      <input type="hidden" th:field="*{medico.nombre}" />
      <input type="hidden" th:field="*{medico.consultorio}" />

      <!-- Botones -->
      <div class="d-flex justify-content-center gap-2 mt-4">
        <button type="submit" class="btn btn-success px-4">Registrar</button>
        <a th:href="@{/citas/consultar}" class="btn btn-dark px-4">Anular</a>
        <a th:href="@{/citas/menu}" class="btn btn-secondary px-4">Regresar</a>
      </div>
    </form>

    <!-- Modal Buscar Paciente -->
    <div class="modal" id="modalBuscarPaciente" aria-labelledby="modalBuscarPacienteLabel" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalBuscarPacienteLabel">Buscar Paciente</h5>
            <button type="button" class="btn-close" id="btnCloseModalPaciente" aria-label="Cerrar">&times;</button>
          </div>
          <div class="modal-body">
            <input type="text" id="inputBuscarPaciente" class="form-control" placeholder="Ingrese nombre o DNI" />
            <div id="resultadoPacientes" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Buscar Disponibilidad de Médico -->
    <div th:replace="~{fragmentos/modalDisponibilidadMedico :: modalDisponibilidadMedicoFragment}"></div>

  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/registrar-cita.js}"></script>
  <script th:src="@{/js/disponibilidad-medico.js}"></script>
</body>
</html>
