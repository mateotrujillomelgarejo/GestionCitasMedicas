<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container text-center">
  <h2>Bienvenido, <span th:text="${usuario}"></span></h2>
  <h5 class="text-muted mb-4">Rol: Administrador</h5>

  <div class="d-grid gap-3 col-6 mx-auto">
    <a href="/usuarios" class="btn btn-primary">Mantenimiento de Usuarios</a>
    <a href="/doctores" class="btn btn-primary">Mantenimiento de Doctores</a>
    <a href="/auditoria" class="btn btn-outline-dark">Auditoría del Sistema</a>
    <a href="/horarios" class="btn btn-outline-primary">Horarios de Doctores</a>
    <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
  </div>
</div>
</body>
</html>
