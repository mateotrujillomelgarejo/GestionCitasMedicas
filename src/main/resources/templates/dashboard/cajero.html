<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel Cajero - Clínica Interna</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <style>
    body {
      background: linear-gradient(135deg, #00bcd4, #007bff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .panel-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding: 2.5rem 2rem;
      text-align: center;
      width: 400px;
      transition: transform 0.3s ease;
    }

    .panel-card:hover {
      transform: translateY(-5px);
    }

    .panel-card h2 {
      color: #007bff;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .panel-card h5 {
      color: #6c757d;
      margin-bottom: 2rem;
    }

    .btn {
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #007bff, #00bcd4);
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #0069d9, #0097a7);
      transform: scale(1.03);
    }

    .btn-outline-primary:hover {
      background-color: #007bff;
      color: white;
      transform: scale(1.03);
    }

    .btn-danger {
      background: linear-gradient(90deg, #dc3545, #ff4b5c);
      border: none;
    }

    .btn-danger:hover {
      background: linear-gradient(90deg, #b71c1c, #ff1a1a);
      transform: scale(1.03);
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="panel-card">
    <h2>Bienvenido, <span th:text="${usuario}">Cajero</span></h2>
    <h5>Rol: Cajero</h5>

    <div class="d-grid gap-3">
      <a href="/cdp" class="btn btn-primary">💳 Generar Comprobante de Pago</a>
      <a th:href="@{/citas/menu}" class="btn btn-outline-primary">📋 Consultar Citas Atendidas</a>

      <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="btn btn-danger w-100">🚪 Cerrar sesión</button>
      </form>
    </div>
  </div>

  <footer>© 2025 Clínica Interna — Sistema de Gestión de Citas Médicas</footer>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
