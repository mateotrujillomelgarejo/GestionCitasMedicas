<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Panel Recepcionista</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container text-center">
  <h2>Bienvenido, <span th:text="${usuario}"></span></h2>
  <h5 class="text-muted mb-4">Rol: <span th:text="${rol}"></span></h5>

  <div class="d-grid gap-3 col-6 mx-auto">
    <a th:href="@{/pacientes}" class="btn btn-primary">Gestión de Pacientes</a>
    <a th:href="@{/citas/registrar}" class="btn btn-primary">Gestión de Citas</a>
    <a th:href="@{/horarios}" class="btn btn-outline-primary">Consultar Horarios</a>
    <a th:href="@{/logout}" class="btn btn-danger">Cerrar Sesión</a>
  </div>
</div>
</body>
</html>
