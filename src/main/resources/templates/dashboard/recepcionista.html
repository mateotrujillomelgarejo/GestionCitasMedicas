<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel del Recepcionista</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" th:href="@{/css/panel-recepcionista.css}">
</head>
<body>

  <div class="container">

    <!-- ==== ENCABEZADO ==== -->
    <h2>Bienvenido, <span th:text="${usuario}">Recepcionista</span></h2>
    <p>Rol: <span th:text="${rol}">RECEPCIONISTA</span></p>

    <!-- ==== MENÚ PRINCIPAL ==== -->
    <div class="menu-section">
      <h5>Panel Principal</h5>

      <div class="menu-grid">
        <a th:href="@{/pacientes}" class="btn btn-primary">Gestión de Pacientes</a>
        <a th:href="@{/citas/menu}" class="btn btn-primary">Gestión de Citas</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
    <button type="submit" class="btn btn-danger">Cerrar sesión</button>
</form>
      </div>
    </div>

  </div>

</body>
</html>
