<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Doctor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Registrar Doctor</h3>
    <a class="btn btn-secondary" href="/doctores">Volver</a>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/doctores/guardar}" th:object="${doctor}" method="post">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input class="form-control" th:field="*{nombre}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Especialidad</label>
      <input class="form-control" th:field="*{especialidad}" required />
    </div>
    <div class="mb-3">
      <label class="form-label">Horario Disponible</label>
      <input class="form-control" th:field="*{horarioDisponible}" placeholder="Lunes a Viernes 8:00-17:00" />
    </div>
    <button class="btn btn-success" type="submit">Guardar</button>
    <a class="btn btn-outline-secondary" href="/doctores">Cancelar</a>
  </form>
</div>
</body>
</html>
