<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Horario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container">
  <h3>Registrar Nuevo Horario</h3>

  <form th:action="@{/horarios/guardar}" method="post">
    <div class="mb-3">
      <label class="form-label">Doctor</label>
      <select name="doctorId" class="form-select" required>
        <option value="">Seleccione</option>
        <option th:each="d : ${doctores}" th:value="${d.id}" th:text="${d.nombre + ' - ' + d.especialidad}"></option>
      </select>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control" required/>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Hora inicio</label>
        <input type="time" name="horaInicio" class="form-control" required/>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Hora fin</label>
        <input type="time" name="horaFin" class="form-control" required/>
      </div>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="/horarios" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
