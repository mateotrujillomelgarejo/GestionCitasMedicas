<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Clínica Interna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/icons/bootstrap-icons.css}">

  <style>
    body {
      background: linear-gradient(135deg, #007bff, #6f42c1);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      padding: 2rem;
      width: 350px;
      text-align: center;
    }

    .login-icon {
      font-size: 3rem;
      color: #007bff;
      margin-bottom: 1rem;
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      border-radius: 10px;
      font-weight: 500;
    }

    .btn-primary:hover {
      background-color: #0069d9;
    }

    .alert {
      margin-top: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <i class="bi bi-person-circle login-icon"></i>
    <h4 class="mb-3 fw-semibold text-primary">Gestión de Citas Médicas</h4>
    <p class="text-muted mb-4">Ingrese sus credenciales</p>

    <form method="post" th:action="@{/login}">
      <div class="mb-3 text-start">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control" required placeholder="Ingrese su usuario">
      </div>
      <div class="mb-3 text-start">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required placeholder="Ingrese su contraseña">
      </div>
      <button class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">❌ Credenciales incorrectas.</div>
    <div th:if="${param.logout}" class="alert alert-success">✅ Sesión cerrada correctamente.</div>
  </div>

  <footer>© 2025 Clínica Interna — Sistema de Citas</footer>
</body>
</html>
