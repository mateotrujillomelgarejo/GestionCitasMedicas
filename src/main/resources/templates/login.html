<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Clínica Interna</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: linear-gradient(135deg, #007bff, #6610f2);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .card {
      width: 350px;
      border-radius: 15px;
    }
  </style>
</head>
<body>
<div class="card shadow-lg p-4 bg-white text-dark">
  <h3 class="text-center mb-3">Inicio de Sesión</h3>
  <form method="post" th:action="@{/login}">
    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" name="username" class="form-control" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" name="password" class="form-control" required/>
    </div>
    <button class="btn btn-primary w-100">Ingresar</button>
  </form>

  <div th:if="${param.error}" class="alert alert-danger mt-3">Credenciales incorrectas.</div>
  <div th:if="${param.logout}" class="alert alert-info mt-3">Sesión cerrada correctamente.</div>
</div>
</body>
</html>
