<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantener Paciente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 40px;
        }

        h2 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }

        .register-btn {
            background-color: #198754;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 10px;
        }

        .register-btn:hover {
            background-color: #157347;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #dee2e6;
            text-align: left;
            padding: 10px;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        td {
            background-color: #fff;
        }

        .action-btn {
            border: none;
            border-radius: 4px;
            color: #fff;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .update-btn {
            background-color: #0d6efd;
        }

        .update-btn:hover {
            background-color: #0b5ed7;
        }

        .deactivate-btn {
            background-color: #dc3545;
        }

        .deactivate-btn:hover {
            background-color: #bb2d3b;
        }

        .actions {
            display: flex;
            gap: 5px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/icons/bootstrap-icons.css}">
</head>
<body>

    <h2>Mantener Paciente</h2>

    <!-- Barra superior de búsqueda y registro -->
    <div class="top-bar">
        <form th:action="@{/pacientes/buscarTabla}" method="get" style="display:flex; width:100%;">
            <input type="text" name="query" placeholder="Buscar por nombre o DNI..." />
            <button type="submit" class="register-btn">Buscar</button>
        </form>

        <a th:href="@{/pacientes/registrar}" class="register-btn">Registrar Paciente</a>
    </div>

    <!-- Tabla de pacientes -->
    <table>
        <thead>
            <tr>
                <th>Nombre Completo</th>
                <th>DNI</th>
                <th>Celular</th>
                <th>Email</th>
                <th>Género</th>
                <th>Dirección</th>
                <th>Fecha de Nacimiento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="paciente : ${pacientes}">
                <td th:text="${paciente.nombreCompleto}">Nombre Completo</td>
                <td th:text="${paciente.dni}">DNI</td>
                <td th:text="${paciente.celular}">Celular</td>
                <td th:text="${paciente.email}">Email</td>
                <td th:text="${paciente.genero}">Género</td>
                <td th:text="${paciente.direccion}">Dirección</td>
                <td th:text="${paciente.fechaNacimiento}">Fecha</td>
                <td class="actions">
                    <a th:href="@{/pacientes/editar/{id}(id=${paciente.idPaciente})}" class="action-btn update-btn">Actualizar</a>
                    <a th:href="@{/pacientes/eliminar/{id}(id=${paciente.idPaciente})}" 
                       class="action-btn deactivate-btn"
                       onclick="return confirm('¿Seguro que deseas desactivar este paciente?');">
                       Desactivar
                    </a>
                </td>
            </tr>

            

            <!-- Si no hay pacientes -->
            <tr th:if="${#lists.isEmpty(pacientes)}">
                <td colspan="8" style="text-align:center; color:#6c757d;">No se encontraron pacientes registrados.</td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/dashboard}" class="btn btn-secondary position-fixed bottom-0 start-0 m-3">
        Volver al Dashboard
    </a>

</body>
</html>
