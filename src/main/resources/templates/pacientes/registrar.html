<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Registrar Paciente</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/icons/bootstrap-icons.css}">
</head>
<body class="p-4">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Registrar Paciente</h3>
    <a class="btn btn-secondary" href="/pacientes">Volver</a>
  </div>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/pacientes/guardar}" th:object="${paciente}" method="post">
    <div class="mb-3">
      <label class="form-label">Nombre Completo</label>
      <input class="form-control" th:field="*{nombreCompleto}" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">DNI</label>
      <input class="form-control" th:field="*{dni}" required/>
    </div>
    <div class="mb-3">
      <label class="form-label">Teléfono</label>
      <input class="form-control" th:field="*{celular}" />
    </div>
    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input class="form-control" type="email" th:field="*{email}" />
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Género</label>
        <select class="form-select" th:field="*{genero}">
          <option value="" disabled selected>Seleccione...</option>
          <option value="M">Masculino</option>
          <option value="F">Femenino</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fecha de Nacimiento</label>
        <input class="form-control" type="date" th:field="*{fechaNacimiento}"/>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Dirección</label>
      <textarea class="form-control" th:field="*{direccion}" rows="2"></textarea>
    </div>
    <button class="btn btn-success" type="submit">Guardar</button>
    <a class="btn btn-outline-secondary" href="/pacientes">Cancelar</a>
  </form>
</div>
</body>
</html>
