<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuario</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/all.min.css}">
  <style>
    body { background-color: #f8f9fa; }
    .card { max-width: 600px; margin: auto; }
  </style>
</head>
<body class="p-4">
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0"><i class="fa-solid fa-user-pen me-2"></i>Editar Usuario</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/usuarios/actualizar}" method="post" th:object="${usuario}">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" th:field="*{username}" class="form-control" readonly/>
        </div>

        <div class="mb-3">
          <label class="form-label">Rol</label>
          <select th:field="*{rol.id}" class="form-select" required>
            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
          </select>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
          <label class="form-check-label" for="activo">Activo</label>
        </div>

        <div class="d-flex justify-content-between">
          <a href="/usuarios" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
