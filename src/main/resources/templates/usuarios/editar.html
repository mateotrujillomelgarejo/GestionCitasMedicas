<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container">
  <h3>Editar Usuario</h3>

  <form th:action="@{/usuarios/actualizar}" method="post" th:object="${usuario}">
    <input type="hidden" th:field="*{id}"/>

    <div class="mb-3">
      <label class="form-label">Usuario</label>
      <input type="text" th:field="*{username}" class="form-control" readonly/>
    </div>

    <div class="mb-3">
      <label class="form-label">Rol</label>
      <select th:field="*{rol.id}" class="form-select" required>
        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
      </select>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
      <label class="form-check-label" for="activo">Activo</label>
    </div>

    <button type="submit" class="btn btn-success">Guardar Cambios</button>
    <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
