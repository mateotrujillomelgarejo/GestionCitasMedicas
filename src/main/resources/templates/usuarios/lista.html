<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios del Sistema</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/all.min.css}">
  <style>
    body { background-color: #f8f9fa; }
    .table-hover tbody tr:hover {
      background-color: #f1f1f1;
      transition: 0.3s;
    }
  </style>
</head>
<body class="p-4">

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="text-primary"><i class="fa-solid fa-users-gear me-2"></i>Usuarios del Sistema</h3>
    <a href="/usuarios/nuevo" class="btn btn-success">
      <i class="fa-solid fa-user-plus me-1"></i> Nuevo Usuario
    </a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card shadow-sm">
    <div class="card-body">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Rol</th>
            <th>Activo</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.rol.nombre}"></td>
            <td>
              <span class="badge" th:classappend="${u.activo ? 'bg-success' : 'bg-danger'}"
                    th:text="${u.activo ? 'Activo' : 'Inactivo'}"></span>
            </td>
            <td class="text-center">
              <a th:href="@{|/usuarios/editar/${u.id}|}" class="btn btn-sm btn-outline-primary me-1" title="Editar">
                <i class="fa-solid fa-pen-to-square"></i>
              </a>
              <a th:href="@{|/usuarios/desactivar/${u.id}|}" class="btn btn-sm btn-outline-warning me-1" title="Desactivar">
                <i class="fa-solid fa-user-slash"></i>
              </a>
              <a th:href="@{|/usuarios/eliminar/${u.id}|}" class="btn btn-sm btn-outline-danger"
                 onclick="return confirm('¿Eliminar este usuario?')" title="Eliminar">
                <i class="fa-solid fa-trash"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <a href="/dashboard" class="btn btn-secondary mt-4">
    <i class="fa-solid fa-arrow-left"></i> Volver al Panel
  </a>
</div>
</body>
</html>
