<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios del Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Usuarios del Sistema</h3>
    <a href="/usuarios/nuevo" class="btn btn-primary">Nuevo Usuario</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${usuarios}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.rol.nombre}"></td>
        <td>
          <span th:text="${u.activo ? 'Sí' : 'No'}" 
                th:classappend="${u.activo ? 'text-success' : 'text-danger'}"></span>
        </td>
        <td>
          <a th:href="@{|/usuarios/editar/${u.id}|}" class="btn btn-sm btn-outline-primary">Editar</a>
          <a th:href="@{|/usuarios/desactivar/${u.id}|}" class="btn btn-sm btn-outline-warning">Desactivar</a>
          <a th:href="@{|/usuarios/eliminar/${u.id}|}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
  <a href="/dashboard" class="btn btn-secondary">Volver</a>
</div>
</body>
</html>
