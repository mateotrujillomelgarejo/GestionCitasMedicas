<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrar Usuario</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/all.min.css}">
  <style>
    body { background-color: #f8f9fa; }
    .card { max-width: 600px; margin: auto; }
  </style>
</head>
<body class="p-4">
<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Registrar Nuevo Usuario</h4>
    </div>
    <div class="card-body">
      <form th:action="@{/usuarios/guardar}" method="post">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">Rol</label>
          <select name="rol.id" class="form-select" required>
            <option value="">Seleccione</option>
            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
          </select>
        </div>

        <div class="d-flex justify-content-between">
          <a href="/usuarios" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Cancelar
          </a>
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-floppy-disk"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
